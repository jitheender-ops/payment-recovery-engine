# Render blueprint. Create from the dashboard: New > Blueprint > point at this repo.
#
# What this wires up:
#   payment-recovery-db    managed Postgres
#   recovery-api           the FastAPI service — this is the Razorpay webhook URL
#   recovery-dashboard     the Streamlit dashboard, password-gated
#
# Migrations are NOT a preDeployCommand (that is a paid-plan feature). They run
# in docker-entrypoint.sh before uvicorn starts, so `alembic upgrade head`
# happens on every boot on any plan. It is idempotent — every step is guarded
# by an inspector check — so repeated boots are no-ops.

# ─────────────────────────────────────────────────────────────────────────
# READ THIS BEFORE PICKING THE FREE PLAN
#
# Render's free web services sleep after ~15 minutes with no inbound request.
# That is fine for a normal API and NOT fine for this one, because Layer 6 is an
# in-process asyncio loop:
#
#   * a deferred `retry_at` scheduled for +4h does not fire while asleep — it
#     fires whenever something next wakes the service, which may be much later;
#   * `reconcile_events` and `expire_promises` stop on the same clock;
#   * a cold start takes tens of seconds, and Razorpay's webhook delivery may
#     time out and mark the endpoint failing before the container is up.
#
# Nothing is lost — a scheduled attempt stays "scheduled" and fires late, and a
# missed webhook is re-sent by Razorpay because a timeout is not a 200 — but
# "retry in 4 hours" becomes "retry in 4 hours, or whenever someone visits".
#
# For a demo that is acceptable if you say so. For anything measured, put the
# API service on a paid instance type so it stays resident. The dashboard can
# stay free; it has no scheduler.
# ─────────────────────────────────────────────────────────────────────────

databases:
  - name: payment-recovery-db
    databaseName: payment_recovery
    user: recovery
    # Free Postgres instances expire. Check Render's current policy before
    # relying on this for anything you cannot rebuild from webhooks.
    plan: free

services:
  # ── API ───────────────────────────────────────────────────────────────
  - type: web
    name: recovery-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    # The entrypoint's "api" mode: alembic upgrade head, then uvicorn.
    dockerCommand: /app/docker-entrypoint.sh api
    envVars:
      # Both point at the SAME injected connection string. Settings normalises
      # each to the driver it needs (src/config.py), so neither needs editing.
      - key: DATABASE_URL
        fromDatabase: {name: payment-recovery-db, property: connectionString}
      - key: DATABASE_URL_SYNC
        fromDatabase: {name: payment-recovery-db, property: connectionString}

      # staging, not production: `production` is equally valid here, but either
      # closes /docs and /redoc and puts /openapi.json behind X-API-Key. Do not
      # set `development` on a public URL — it opens the whole schema.
      - key: APP_ENV
        value: staging
      - key: LOG_LEVEL
        value: INFO
      # One worker on the free plan. Each worker runs its own scheduler loop;
      # they are safe together (both sweeps claim rows with a conditional
      # UPDATE) but on a 512MB instance the memory matters more.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: SCHEDULER_INTERVAL_SECONDS
        value: "60"

      - key: LLM_PROVIDER
        value: openai
      # LLM_BASE_URL left unset — defaults to https://api.openai.com/v1

      # sync: false = "prompt me in the dashboard, never store in git".
      # Set each of these once, under the service's Environment tab.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: API_KEY
        generateValue: true          # guards /openapi.json outside development
      - key: DASHBOARD_PASSWORD
        sync: false                  # must MATCH the dashboard service below

      # ── Customer recovery page ──────────────────────────────────────
      # Signs /recover/<token>. generateValue means Render mints it once and
      # keeps it — nobody has to invent, paste or store a secret by hand, and
      # it never touches git. A dedicated secret, not the webhook one.
      - key: RECOVERY_LINK_SECRET
        generateValue: true
      # The origin customers open the link on. Taken from the service itself so
      # it is correct the moment the service exists; override with a custom
      # domain once you have one, since an onrender.com host in an SMS asking
      # for money is not a link most people would trust.
      - key: PUBLIC_BASE_URL
        fromService: {type: web, name: recovery-api, property: host}

  # ── Dashboard ─────────────────────────────────────────────────────────
  - type: web
    name: recovery-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    dockerCommand: /app/docker-entrypoint.sh dashboard
    envVars:
      # Sync only, never async: the dashboard reads through pandas.read_sql.
      - key: DATABASE_URL_SYNC
        fromDatabase: {name: payment-recovery-db, property: connectionString}
      - key: APP_ENV
        value: staging
      # The only thing in front of live payment data. Empty means the dashboard
      # refuses to render, which is the intended fail-closed behaviour — but it
      # means a blank here looks like a broken deploy. Set the SAME value you
      # gave recovery-api.
      - key: DASHBOARD_PASSWORD
        sync: false
