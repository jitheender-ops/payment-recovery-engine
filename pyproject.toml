[project]
name = "payment-recovery-engine"
version = "0.1.0"
description = "AI-powered payment failure recovery engine for Razorpay"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Core web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",

    # Validation & config
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # LLM
    "anthropic>=0.30.0",
    "openai>=1.35.0",

    # ML baseline
    "xgboost>=2.0.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "joblib>=1.4.0",

    # Dashboard
    "streamlit>=1.36.0",
    "plotly>=5.22.0",

    # Messaging templates
    "jinja2>=3.1.0",

    # Razorpay SDK
    "razorpay>=1.4.0",

    # Utilities
    "pyyaml>=6.0.0",
    "rich>=13.7.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Aligned calibration/fixture tables: the column alignment IS the readability.
# Wrapping them to 100 chars makes a bank's rates unscannable across rails.
"eval/bank_profiles.py" = ["E501"]
"scripts/simulate_webhooks.py" = ["E501"]
# Uppercase X for a feature matrix is universal sklearn/xgboost convention.
"scripts/train_xgboost.py" = ["N806"]
"src/agent/xgboost_baseline.py" = ["N803"]
# FailureClass is (str, Enum), not StrEnum, on purpose: StrEnum would change
# str() output from "FailureClass.x" to "x" and those values are persisted.
"src/classifier/taxonomy.py" = ["UP042"]

[tool.mypy]
python_version = "3.11"
strict = true

# No published type stubs installed for these. pandas-stubs / types-tabulate /
# types-PyYAML would remove this block if added to the dev extra.
[[tool.mypy.overrides]]
module = ["pandas.*", "tabulate.*", "yaml.*", "joblib.*", "sklearn.*", "plotly.*", "razorpay.*", "streamlit.*", "xgboost.*"]
ignore_missing_imports = true
