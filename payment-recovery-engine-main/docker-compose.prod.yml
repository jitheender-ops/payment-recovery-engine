# Production stack. STANDALONE — do not combine it with docker-compose.yml:
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Standalone rather than an overlay because compose MERGES list fields. The base
# file bind-mounts `.:/app`, and an override cannot remove a list entry — it
# appends to it. So `-f docker-compose.yml -f docker-compose.prod.yml` would
# quietly keep serving the host working tree over the verified image, which is
# the one thing this file exists to prevent. Duplication is the cheaper mistake.
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: payment_recovery
      POSTGRES_USER: recovery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Never published. app and dashboard reach it over the compose network.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovery -d payment_recovery"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-staging}
      DATABASE_URL: postgresql+asyncpg://recovery:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/payment_recovery
      DATABASE_URL_SYNC: postgresql://recovery:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/payment_recovery
      # Each uvicorn worker runs its own scheduler loop. Safe — both sweeps
      # claim their rows with a conditional UPDATE before acting — but it is N
      # times the polling for no gain. Raise this for HTTP throughput only.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    # No source mount: the image is what runs. ENTRYPOINT applies migrations
    # then starts uvicorn without --reload.
    command: ["api"]
    # Loopback only. Put a TLS terminator in front for the public webhook URL —
    # Razorpay will not post to plain HTTP, and nothing here terminates TLS.
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: &logs
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL_SYNC: postgresql://recovery:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/payment_recovery
    command: ["dashboard"]
    ports:
      - "127.0.0.1:${STREAMLIT_PORT:-8501}:8501"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logs

volumes:
  pgdata:
