<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Recovery loop mark: a broken payment that comes back around. -->
  <rect width="64" height="64" rx="14" fill="#0d0d0d"/>
  <path d="M20 40 a14 14 0 1 0 4 10" fill="none" stroke="#8fbfff" stroke-width="5"
        stroke-linecap="round"/>
  <!-- the break in the loop: the failure this engine closes -->
  <path d="M38 22 l6 -6 M44 22 l-6 -6" stroke="#f4f4f4" stroke-width="5" stroke-linecap="round"/>
  <path d="M14 14 l6 6 M20 14 l-6 6" stroke="#f4f4f4" stroke-width="5" stroke-linecap="round" opacity="0.25"/>
</svg>
