<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recovery Page — Clickable Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,500..800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0F2B4C;
    --ink-2: #41546E;
    --ink-3: #7C8BA1;
    --paper: #F6F7F5;
    --card: #FFFFFF;
    --line: #E2E6E3;
    --credit: #0E7A4D;
    --credit-bg: #EDF6F0;
    --pending: #B26A00;
    --pending-bg: #FBF3E4;
    --alert: #B3261E;
    --alert-bg: #FBEFEE;
    --bezel: #0B0E13;
    --backdrop: #0B1F38;
    --disp: "Archivo", system-ui, sans-serif;
    --body: "Public Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--body);
    background: var(--backdrop);
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 34px 34px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 34px 16px 60px;
    color: var(--ink);
  }
  button { font-family: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid #7FB2FF; outline-offset: 2px; border-radius: 4px; }

  .stage-head {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #8FA9C9;
    text-align: center;
    margin-bottom: 22px;
    line-height: 1.9;
  }
  .stage-head b { color: #D7E4F5; font-weight: 600; }

  /* ── Phone ─────────────────────────────────────────────────────── */
  .phone {
    width: 392px;
    max-width: 100%;
    background: var(--bezel);
    border-radius: 46px;
    padding: 11px;
    box-shadow: 0 30px 80px rgba(2,10,24,.55), 0 2px 0 rgba(255,255,255,.06) inset;
  }
  .screen {
    position: relative;
    background: var(--paper);
    border-radius: 36px;
    height: 792px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .statusbar {
    flex: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 26px 6px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
  }
  .statusbar .sig { letter-spacing: .1em; font-size: 10px; color: var(--ink-2); }
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 6px 18px 22px;
    scrollbar-width: none;
  }
  .content::-webkit-scrollbar { display: none; }

  /* ── Masthead ──────────────────────────────────────────────────── */
  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 2px 14px;
  }
  .merchant { display: flex; align-items: center; gap: 9px; }
  .merchant .mono-mark {
    width: 30px; height: 30px;
    background: var(--ink);
    color: #fff;
    font-family: var(--disp);
    font-weight: 700;
    font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
  }
  .merchant .m-name { font-weight: 700; font-size: 14px; letter-spacing: -.01em; }
  .merchant .m-sub { font-family: var(--mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  .langswitch {
    display: flex;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    overflow: hidden;
  }
  .langswitch button {
    border: none;
    background: transparent;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    padding: 5px 10px;
    color: var(--ink-3);
  }
  .langswitch button.on { background: var(--ink); color: #fff; }

  /* ── Hero card ─────────────────────────────────────────────────── */
  .hero {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 16px 18px;
    box-shadow: 0 1px 2px rgba(15,43,76,.05), 0 8px 24px rgba(15,43,76,.06);
    position: relative;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: .13em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
  .chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .chip.tone-ink { background: #EDF1F7; color: var(--ink); }
  .chip.tone-pending { background: var(--pending-bg); color: var(--pending); }
  .chip.tone-credit { background: var(--credit-bg); color: var(--credit); }
  .chip.tone-alert { background: var(--alert-bg); color: var(--alert); }
  .chip.tone-mute { background: #EFF1F0; color: var(--ink-2); }
  .hero .about {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 4px;
  }
  .amount {
    font-family: var(--disp);
    font-stretch: 125%;
    font-weight: 800;
    font-size: 44px;
    letter-spacing: -.015em;
    line-height: 1.05;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .amount.small { font-size: 32px; }
  .moneysafe {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 8px;
    color: var(--credit);
    font-weight: 600;
    font-size: 13.5px;
  }
  .moneysafe svg { flex: none; }
  .herostate {
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    margin-top: 6px;
  }
  .herostate-sub { font-size: 13px; color: var(--ink-2); margin-top: 4px; line-height: 1.5; }

  /* ── The money rail (signature) ────────────────────────────────── */
  .rail { margin-top: 20px; padding: 0 16px; }
  .rail-inner { position: relative; height: 58px; }
  .rail-track {
    position: absolute;
    left: 0; right: 0; top: 13px;
    height: 3px;
    background: var(--line);
    border-radius: 2px;
  }
  .rail-track .fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 0%;
    background: var(--credit);
    border-radius: 2px;
    transition: width 1s cubic-bezier(.6,.05,.2,1) .15s;
  }
  .rail-node {
    position: absolute;
    top: 8px;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    width: 90px;
  }
  .rail-node i {
    width: 13px; height: 13px;
    border-radius: 50%;
    background: var(--card);
    border: 3px solid var(--line);
    transition: border-color .4s;
  }
  .rail-node span {
    font-size: 10.5px;
    color: var(--ink-3);
    text-align: center;
    line-height: 1.25;
    transition: color .4s;
  }
  .rail-node.here span { color: var(--ink); font-weight: 700; }
  .rail-node.here i { border-color: var(--ink); }
  .rail-node.done i { border-color: var(--credit); background: var(--credit); }
  .rail-node.done span { color: var(--credit); font-weight: 600; }
  .rail-coin {
    position: absolute;
    top: 0;
    left: 0%;
    transform: translateX(-50%);
    width: 29px; height: 29px;
    border-radius: 50%;
    background: var(--ink);
    color: #fff;
    font-family: var(--disp);
    font-weight: 700;
    font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 8px rgba(15,43,76,.35);
    transition: left 1.1s cubic-bezier(.6,.05,.2,1);
    z-index: 2;
  }
  .rail-coin.credit { background: var(--credit); box-shadow: 0 3px 8px rgba(14,122,77,.4); }
  .rail.pulsing .rail-coin::after {
    content: "";
    position: absolute;
    inset: -7px;
    border-radius: 50%;
    border: 2px solid var(--pending);
    animation: pulse 1.7s ease-out infinite;
  }
  @keyframes pulse {
    0% { transform: scale(.7); opacity: .9; }
    100% { transform: scale(1.25); opacity: 0; }
  }

  /* ── Cards & blocks ────────────────────────────────────────────── */
  .block {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    margin-top: 12px;
  }
  .block h3 { font-size: 13.5px; font-weight: 700; margin-bottom: 5px; }
  .block p { font-size: 13px; color: var(--ink-2); line-height: 1.55; }
  .block.quiet { background: transparent; border-style: dashed; }
  .block.tint-credit { background: var(--credit-bg); border-color: #CFE6D8; }
  .block.tint-alert { background: var(--alert-bg); border-color: #EFD3D1; }
  .block.tint-pending { background: var(--pending-bg); border-color: #EBD9B8; }

  .faq { margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); overflow: hidden; }
  .faq summary {
    list-style: none;
    cursor: pointer;
    padding: 13px 16px;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
  }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: "+"; font-family: var(--mono); color: var(--ink-3); font-size: 16px; }
  .faq[open] summary::after { content: "–"; }
  .faq .faq-body { padding: 0 16px 14px; font-size: 12.5px; color: var(--ink-2); line-height: 1.55; }

  /* ── Buttons ───────────────────────────────────────────────────── */
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .01em;
    transition: transform .06s ease, background .2s;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--ink); color: #fff; margin-top: 16px; }
  .btn-primary:hover { background: #16385F; }
  .btn-primary.busy { background: #35507A; pointer-events: none; }
  .btn-ghost {
    background: var(--card);
    border: 1.5px solid var(--line);
    color: var(--ink);
    font-weight: 600;
    margin-top: 10px;
  }
  .btn-ghost .wa-dot { width: 9px; height: 9px; border-radius: 50%; background: #21A65C; }
  .linkish {
    display: block;
    width: 100%;
    background: none;
    border: none;
    text-align: center;
    font-size: 12.5px;
    color: var(--ink-3);
    text-decoration: underline;
    text-underline-offset: 3px;
    padding: 12px 0 2px;
  }
  .expiry {
    text-align: center;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-3);
    margin-top: 14px;
    letter-spacing: .02em;
  }
  .trust {
    text-align: center;
    font-size: 11px;
    color: var(--ink-3);
    margin-top: 12px;
    line-height: 1.5;
  }
  .spinner {
    width: 16px; height: 16px;
    border: 2.5px solid rgba(255,255,255,.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  .spinner.dark { border-color: rgba(15,43,76,.2); border-top-color: var(--ink); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .center-spin { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 26px 0 10px; color: var(--ink-2); font-size: 13.5px; }

  /* ── Receipt ───────────────────────────────────────────────────── */
  .receipt {
    margin-top: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-bottom: none;
    border-radius: 12px 12px 0 0;
    padding: 16px 16px 18px;
    position: relative;
    box-shadow: 0 8px 24px rgba(15,43,76,.07);
  }
  .receipt .zig {
    height: 10px;
    margin: 18px -17px -19px;
    background:
      linear-gradient(-135deg, var(--card) 5.5px, transparent 0) 0 0,
      linear-gradient(135deg, var(--card) 5.5px, transparent 0) 0 0;
    background-size: 11px 10px;
    background-repeat: repeat-x;
    filter: drop-shadow(0 2px 1px rgba(15,43,76,.06));
  }
  .receipt h3 {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 10px;
  }
  .rrow {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px dashed var(--line);
    font-size: 13px;
  }
  .rrow:last-of-type { border-bottom: none; }
  .rrow .k { color: var(--ink-2); }
  .rrow .v { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--ink); text-align: right; }
  .stamp {
    position: absolute;
    top: 12px; right: 14px;
    transform: rotate(-7deg);
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--credit);
    border: 2px solid var(--credit);
    outline: 1.5px solid var(--credit);
    outline-offset: 2.5px;
    border-radius: 5px;
    padding: 5px 9px 4px;
    opacity: 0;
    animation: stampIn .45s cubic-bezier(.2,1.6,.4,1) .7s forwards;
  }
  @keyframes stampIn {
    from { opacity: 0; transform: rotate(-7deg) scale(1.6); }
    to { opacity: .92; transform: rotate(-7deg) scale(1); }
  }
  .checkdraw { display: block; margin: 4px auto 0; color: var(--credit); }
  .checkdraw path {
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: draw .55s ease .25s forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* ── Checkout sheet ────────────────────────────────────────────── */
  .scrim {
    position: absolute;
    inset: 0;
    background: rgba(10,18,32,.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
    z-index: 5;
  }
  .sheet {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: var(--card);
    border-radius: 20px 20px 0 0;
    padding: 14px 18px 20px;
    transform: translateY(105%);
    transition: transform .38s cubic-bezier(.3,.9,.3,1);
    z-index: 6;
    box-shadow: 0 -12px 40px rgba(2,10,24,.25);
  }
  .screen.checkout .scrim { opacity: 1; pointer-events: auto; }
  .screen.checkout .sheet { transform: translateY(0); }
  .sheet .grab { width: 38px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 14px; }
  .sheet .s-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .sheet .s-head h3 { font-size: 15px; font-weight: 700; }
  .sheet .s-head .s-amt { font-family: var(--disp); font-stretch: 125%; font-weight: 700; font-size: 18px; }
  .method {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 11px;
    padding: 12px 14px;
    margin-bottom: 8px;
    text-align: left;
    transition: border-color .15s, background .15s;
  }
  .method[aria-pressed="true"] { border-color: var(--ink); background: #F3F6FA; }
  .method .m-ico {
    flex: none;
    width: 34px; height: 34px;
    border-radius: 9px;
    background: #EFF2F6;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--ink);
  }
  .method .m-t { font-size: 13.5px; font-weight: 700; }
  .method .m-s { font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }
  .method .rec {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 8.5px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--credit);
    background: var(--credit-bg);
    padding: 3px 7px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .sheet .btn-primary { margin-top: 8px; }

  /* ── Prototype controls ────────────────────────────────────────── */
  .controls {
    width: 392px;
    max-width: 100%;
    margin-top: 26px;
  }
  .controls .c-label {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #5E7CA3;
    margin: 14px 0 8px;
  }
  .c-row { display: flex; flex-wrap: wrap; gap: 7px; }
  .c-btn {
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 500;
    color: #C9DAEF;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(201,218,239,.28);
    border-radius: 7px;
    padding: 7px 11px;
    transition: background .15s, border-color .15s;
  }
  .c-btn:hover { background: rgba(255,255,255,.1); border-color: rgba(201,218,239,.55); }
  .c-btn.on { background: #C9DAEF; color: var(--backdrop); border-color: #C9DAEF; font-weight: 600; }
  .c-btn.go { border-color: rgba(78,196,137,.6); color: #7FDCA6; }
  .c-btn.go:hover { background: rgba(78,196,137,.14); }
  .footnote {
    margin-top: 26px;
    font-family: var(--mono);
    font-size: 10px;
    color: #5E7CA3;
    text-align: center;
    line-height: 1.8;
    max-width: 460px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
  @media (max-width: 430px) {
    body { padding-top: 18px; }
    .screen { height: 86vh; }
  }
</style>
</head>
<body>

  <div class="stage-head">
    <b>Customer recovery flow — clickable prototype</b><br>
    every state below is server-decided in production · demo data only
  </div>

  <div class="phone">
    <div class="screen" id="screen">
      <div class="statusbar">
        <span id="clock">9:41</span>
        <span class="sig">5G ▮▮▮</span>
      </div>
      <div class="content" id="content" aria-live="polite"></div>

      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet" role="dialog" aria-label="Checkout"></div>
    </div>
  </div>

  <div class="controls">
    <div class="c-label">Flow</div>
    <div class="c-row">
      <button class="c-btn go" data-go="happy">▶ Run happy path</button>
      <button class="c-btn" data-go="reset">Reset</button>
    </div>
    <div class="c-label">Jump to state — mirrors _view_state()</div>
    <div class="c-row" id="stateBtns">
      <button class="c-btn" data-state="payable">Payable</button>
      <button class="c-btn" data-state="payable_upi">Payable · UPI</button>
      <button class="c-btn" data-state="confirming">Confirming</button>
      <button class="c-btn" data-state="unknown">Unknown</button>
      <button class="c-btn" data-state="recovered">Receipt</button>
      <button class="c-btn" data-state="stopped">Stopped</button>
      <button class="c-btn" data-state="not_retryable">Not retryable</button>
      <button class="c-btn" data-state="opted_out">Opted out</button>
      <button class="c-btn" data-state="expired">Expired link</button>
    </div>
  </div>

  <div class="footnote">
    No real payment is made · states, ordering and copy mirror src/customer/routes.py<br>
    low-fi structure sheet: docs/wireframes.html
  </div>

<script>
(function () {
  "use strict";

  var MERCHANT = "Paperbird Books";
  var AMT = "₹2,499";
  var EXPIRY = "Sat, 28 Aug, 11:02 AM";
  var REF = "pay_NxT4kQ9xZ";
  var UTR = "UTR823100457712";
  var RECV_AT = "27 Aug 2026, 10:04";

  var I18N = {
    en: {
      mast_sub: "Payment recovery",
      about: "About your payment to " + MERCHANT,
      money_safe: "No money has left your account.",
      rail_you: "Your account", rail_transit: "In transit", rail_merchant: "Merchant",
      what: "What happened",
      story_t: "Your bank declined the payment",
      story_b: "The card needed an OTP and the OTP step was never completed. The payment was rolled back — nothing was charged.",
      story_upi_t: "The OTP step wasn't completed",
      story_upi_b: "UPI needs no OTP at all — it's the surest way to finish this payment.",
      pay_secure: "Pay " + AMT + " securely",
      pay_upi: "Pay " + AMT + " by UPI",
      pay_other: "Use a different method",
      trust: "Payments secured by Razorpay · your card details are never seen or stored by us",
      link_until: "This link works until " + EXPIRY,
      whatsapp: "Talk to us on WhatsApp",
      optout: "Don't contact me about this payment",
      chip_action: "Action needed", chip_checking: "Checking", chip_waiting: "Waiting on bank",
      chip_received: "Received", chip_stopped: "Stopped", chip_blocked: "Blocked by bank",
      chip_unsub: "Unsubscribed", chip_expired: "Link expired",
      checking_t: "Checking your payment…",
      checking_b: "This page will check again by itself in a few seconds.",
      check_again: "Check again",
      faq_q: "I was charged, but this page says failed",

      story_upi_t: "OTP की प्रक्रिया पूरी नहीं हुई",
      story_upi_b: "UPI में OTP की ज़रूरत ही नहीं होती — यह भुगतान पूरा करने का सबसे पक्का तरीका है।",

      pay_upi: "UPI से " + AMT + " का भुगतान करें",

      chip_received: "प्राप्त", chip_stopped: "रोका गया", chip_blocked: "बैंक द्वारा अवरोधित",

      received_t: "भुगतान मिल गया",
      receipt: "रसीद", r_amount: "भुगतान की गई राशि", r_ref: "भुगतान संदर्भ", r_on: "प्राप्त हुआ",
      r_note: "ऊपर दिया गया संदर्भ ही UTR है, जो आपके बैंक स्टेटमेंट में दिखेगा।",

      blocked_t: "सुरक्षा के कारण आपके बैंक ने यह भुगतान रोका है",
      blocked_b: "इसे केवल आपका बैंक ही ठीक कर सकता है। दोबारा कोशिश करने से पहले कार्ड के पीछे दिए नंबर पर कॉल करें।",
      unsub_t: "हमने आपसे संपर्क करना बंद कर दिया है",
      unsub_b: "यदि आप मन बदलें, तो हमारे किसी भी संदेश का जवाब दें — हम इसे फिर से शुरू कर देंगे।",
      expired_t: "यह लिंक समाप्त हो गया है",
      expired_b: "आपकी सुरक्षा के लिए रिकवरी लिंक केवल थोड़े समय के लिए काम करते हैं। अभी भी भुगतान करना है? हमारे भेजे संदेश का जवाब दें।",
      preparing: "सुरक्षित भुगतान तैयार हो रहा है…",
      sheet_title: "भुगतान का तरीका चुनें",
      m_upi_sub: "OTP की ज़रूरत नहीं", m_card: "कार्ड", m_card_sub: "OTP ज़रूरी होगा",
      m_nb: "नेटबैंकिंग", m_nb_sub: "सभी प्रमुख बैंक", rec: "अनुशंसित",
      sheet_pay: AMT + " का भुगतान करें",
      ref_quote: "संदर्भ " + REF + " बताएँ"
    }
  };

  var lang = "en";
  var state = "payable";
  var timers = [];

  function t(k) { return (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k; }
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  var CLOCKS = {
    payable: "9:41", payable_upi: "9:41", confirming: "9:43", unknown: "10:02",
    recovered: "10:04", stopped: "10:04", not_retryable: "9:41", opted_out: "10:05", expired: "10:04"
  };

  function shield() {
    return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3.5v5.2c0 5-3.4 9.4-8 11.3-4.6-1.9-8-6.3-8-11.3V5.5L12 2z"/><path d="M8.5 12l2.4 2.4 4.6-4.8"/></svg>';
  }

  function masthead() {
    return '<div class="masthead">' +
      '<div class="merchant">' +
        '<div class="mono-mark">P</div>' +
        '<div><div class="m-name">' + MERCHANT + '</div><div class="m-sub">' + t("mast_sub") + '</div></div>' +
      '</div>' +
      '<div class="langswitch" role="group" aria-label="Language">' +
        '<button data-act="lang-en" class="' + (lang === "en" ? "on" : "") + '">EN</button>' +
        '<button data-act="lang-hi" class="' + (lang === "hi" ? "on" : "") + '">हिं</button>' +
      '</div>' +
    '</div>';
  }

  function rail(pos, opts) {
    opts = opts || {};
    var nodes = [
      { k: "rail_you", x: "0%", cls: pos === 0 ? "here" : (pos === 2 ? "done" : "") },
      { k: "rail_transit", x: "50%", cls: "" },
      { k: "rail_merchant", x: "100%", cls: pos === 2 ? "done" : "" }
    ];
    var html = '<div class="rail' + (opts.pulse ? ' pulsing' : '') + '"><div class="rail-inner">';
    html += '<div class="rail-track"><div class="fill" style="width:' + (pos === 2 ? "100" : "0") + '%"></div></div>';
    nodes.forEach(function (n) {
      html += '<div class="rail-node ' + n.cls + '" style="left:' + n.x + '"><i></i><span>' + t(n.k) + '</span></div>';
    });
    html += '<div class="rail-coin' + (pos === 2 ? " credit" : "") + '" style="left:' + ["0%", "50%", "100%"][pos] + '">₹</div>';
    html += '</div></div>';
    return html;
  }

  function hero(chipTone, chipKey, inner) {
    return '<div class="hero"><span class="chip tone-' + chipTone + '">' + t(chipKey) + '</span>' + inner + '</div>';
  }

  function amountBlock(withSafe, small) {
    return '<div class="about">' + t("about") + '</div>' +
      '<div class="amount' + (small ? " small" : "") + '">' + AMT + '</div>' +
      (withSafe ? '<div class="moneysafe">' + shield() + '<span>' + t("money_safe") + '</span></div>' : '');
  }

  function whatsapp() {
    return '<button class="btn btn-ghost" data-act="noop"><span class="wa-dot"></span>' + t("whatsapp") + '</button>';
  }

  function faq() {
    return '<details class="faq"><summary>' + t("faq_q") + '</summary><div class="faq-body">' + t("faq_a") + '</div></details>';
  }

  var SCREENS = {
    payable: function () {
      return masthead() +
        hero("ink", "chip_action", amountBlock(true) + rail(0)) +
        '<div class="block"><h3>' + t("what") + '</h3><p><b>' + t("story_t") + '.</b> ' + t("story_b") + '</p></div>' +
        '<button class="btn btn-primary" data-act="pay">' + t("pay_secure") + '</button>' +
        '<div class="trust">' + t("trust") + '</div>' +
        faq() +
        '<div class="expiry">' + t("link_until") + '</div>' +
        whatsapp() +
        '<button class="linkish" data-act="optout">' + t("optout") + '</button>';
    },
    payable_upi: function () {
      return masthead() +
        hero("ink", "chip_action", amountBlock(true) + rail(0)) +
        '<div class="block"><h3>' + t("story_upi_t") + '</h3><p>' + t("story_upi_b") + '</p></div>' +
        '<button class="btn btn-primary" data-act="pay">' + t("pay_upi") + '</button>' +
        '<button class="btn btn-ghost" data-act="pay">' + t("pay_other") + '</button>' +
        '<div class="trust">' + t("trust") + '</div>' +
        faq() +
        '<div class="expiry">' + t("link_until") + '</div>' +
        whatsapp() +
        '<button class="linkish" data-act="optout">' + t("optout") + '</button>';
    },
    confirming: function () {
      return masthead() +
        hero("pending", "chip_checking",
          '<div class="about">' + t("about") + '</div>' +
          '<div class="amount small">' + AMT + '</div>' +
          '<div class="herostate">' + t("checking_t") + '</div>' +
          rail(0, { pulse: true })) +
        '<div class="block quiet center-spin"><div class="spinner dark"></div><span>' + t("checking_b") + '</span></div>' +
        '<button class="btn btn-ghost" data-act="check">' + t("check_again") + '</button>' +
        faq();
    },
    unknown: function () {
      return masthead() +
        hero("pending", "chip_waiting",
          '<div class="about">' + t("about") + '</div>' +
          '<div class="amount small">' + AMT + '</div>' +
          '<div class="herostate">' + t("unknown_t") + '</div>' +
          rail(0)) +
        '<div class="block tint-pending"><p>' + t("unknown_b") + '</p></div>' +
        '<button class="btn btn-ghost" data-act="check">' + t("check_again") + '</button>' +
        '<div class="expiry">' + t("ref_quote") + '</div>' +
        whatsapp();
    },
    recovered: function () {
      return masthead() +
        hero("credit", "chip_received",
          '<div class="herostate" style="margin-top:0">' + t("received_t") + '</div>' +
          '<div class="amount">' + AMT + '</div>' +
          rail(2)) +
        '<div class="receipt">' +
          '<div class="stamp">' + t("stamp") + '</div>' +
          '<svg class="checkdraw" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5" pathLength="1"/></svg>' +
          '<h3>' + t("receipt") + '</h3>' +
          '<div class="rrow"><span class="k">' + t("r_amount") + '</span><span class="v">' + AMT + '</span></div>' +
          '<div class="rrow"><span class="k">' + t("r_ref") + '</span><span class="v">' + UTR + '</span></div>' +
          '<div class="rrow"><span class="k">' + t("r_on") + '</span><span class="v">' + RECV_AT + '</span></div>' +
          '<div class="zig"></div>' +
        '</div>' +
        '<div class="trust">' + t("r_note") + '</div>';
    },
    stopped: function () {
      return masthead() +
        hero("mute", "chip_stopped", amountBlock(true, true) + rail(0)) +
        '<div class="block"><h3>' + t("stopped_t") + '</h3><p>' + t("stopped_b") + ' ' + t("stopped_b2") + '</p></div>' +
        whatsapp() +
        '<div class="expiry">' + t("ref_quote") + '</div>';
    },
    not_retryable: function () {
      return masthead() +
        hero("alert", "chip_blocked", amountBlock(true) + rail(0)) +
        '<div class="block tint-alert"><h3>' + t("blocked_t") + '</h3><p>' + t("blocked_b") + '</p></div>' +
        whatsapp() +
        '<div class="expiry">' + t("ref_quote") + '</div>';
    },
    opted_out: function () {
      return masthead() +
        hero("mute", "chip_unsub",
          '<div class="herostate" style="margin-top:0">' + t("unsub_t") + '</div>' +
          '<div class="moneysafe">' + shield() + '<span>' + t("money_safe") + '</span></div>' +
          rail(0)) +
        '<div class="block quiet"><p>' + t("unsub_b") + '</p></div>';
    },
    expired: function () {
      return masthead() +
        hero("mute", "chip_expired",
          '<div class="herostate" style="margin-top:0">' + t("expired_t") + '</div>' +
          '<div class="herostate-sub">' + t("expired_b") + '</div>') +
        whatsapp();
    }
  };

  var screenEl = document.getElementById("screen");
  var contentEl = document.getElementById("content");
  var sheetEl = document.getElementById("sheet");
  var clockEl = document.getElementById("clock");

  function render() {
    contentEl.innerHTML = SCREENS[state]();
    clockEl.textContent = CLOCKS[state] || "9:41";
    contentEl.scrollTop = 0;
    document.querySelectorAll("#stateBtns .c-btn").forEach(function (b) {
      b.classList.toggle("on", b.dataset.state === state);
    });
  }

  function setState(s) {
    clearTimers();
    state = s;
    screenEl.classList.remove("checkout");
    render();
    if (s === "confirming") later(function () { setState("recovered"); }, 4600);
  }

  function renderSheet(method) {
    method = method || "upi";
    sheetEl.innerHTML =
      '<div class="grab"></div>' +
      '<div class="s-head"><h3>' + t("sheet_title") + '</h3><span class="s-amt">' + AMT + '</span></div>' +
      '<button class="method" data-act="m-upi" aria-pressed="' + (method === "upi") + '">' +
        '<span class="m-ico">UPI</span>' +
        '<span><span class="m-t">UPI</span><div class="m-s">' + t("m_upi_sub") + '</div></span>' +
        '<span class="rec">' + t("rec") + '</span>' +
      '</button>' +
      '<button class="method" data-act="m-card" aria-pressed="' + (method === "card") + '">' +
        '<span class="m-ico">₹</span>' +
        '<span><span class="m-t">' + t("m_card") + '</span><div class="m-s">' + t("m_card_sub") + '</div></span>' +
      '</button>' +
      '<button class="method" data-act="m-nb" aria-pressed="' + (method === "nb") + '">' +
        '<span class="m-ico">NB</span>' +
        '<span><span class="m-t">' + t("m_nb") + '</span><div class="m-s">' + t("m_nb_sub") + '</div></span>' +
      '</button>' +
      '<button class="btn btn-primary" data-act="sheet-pay">' + t("sheet_pay") + '</button>';
  }

  function openSheet() {
    renderSheet("upi");
    screenEl.classList.add("checkout");
  }

  function doPay() {
    var btn = contentEl.querySelector('[data-act="pay"]');
    if (!btn) return;
    btn.classList.add("busy");
    btn.innerHTML = '<span class="spinner"></span>' + t("preparing");
    later(openSheet, 1100);
  }

  function sheetPay() {
    var btn = sheetEl.querySelector('[data-act="sheet-pay"]');
    btn.classList.add("busy");
    btn.innerHTML = '<span class="spinner"></span>';
    later(function () { setState("confirming"); }, 900);
  }

  function runHappy() {
    setState("payable");
    later(doPay, 800);
    later(function () {
      var b = sheetEl.querySelector('[data-act="sheet-pay"]');
      if (screenEl.classList.contains("checkout") && b) sheetPay();
    }, 3400);
  }

  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act],[data-state],[data-go]");
    if (!el) return;
    if (el.dataset.go === "happy") return runHappy();
    if (el.dataset.go === "reset") return setState("payable");
    if (el.dataset.state) return setState(el.dataset.state);
    switch (el.dataset.act) {
      case "lang-en": lang = "en"; render(); if (screenEl.classList.contains("checkout")) renderSheet(); break;
      case "lang-hi": lang = "hi"; render(); if (screenEl.classList.contains("checkout")) renderSheet(); break;
      case "pay": doPay(); break;
      case "m-upi": renderSheet("upi"); break;
      case "m-card": renderSheet("card"); break;
      case "m-nb": renderSheet("nb"); break;
      case "sheet-pay": sheetPay(); break;
      case "check":
        clearTimers();
        el.innerHTML = '<span class="spinner dark"></span>';
        later(function () { setState("recovered"); }, 800);
        break;
      case "optout": setState("opted_out"); break;
      case "noop": break;
    }
  });

  document.getElementById("scrim").addEventListener("click", function () {
    screenEl.classList.remove("checkout");
  });

  render();
})();
</script>
